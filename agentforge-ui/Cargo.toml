[package]
name = "agentforge-ui"
version = "0.1.0"
edition = "2021"
default-run = "agentforge-ui"

[dependencies]
gpui = "0.2.2"
gpui-component-assets = "0.5.1"
gpui-component = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-i18n = "3.0"
anyhow = "1.0"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
rust-embed = "8.4"
futures = "0.3.32"
tokio = { version = "1.51.1", features = ["rt", "sync", "macros", "process", "full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1.89"
notify = "6.1.1"
once_cell = "1.21.4"
rfd = "0.15"
reqwest-eventsource = "0.6.0"
async-stream = "0.3.6"
pulldown-cmark = "0.13.3"
markdown = "1.0"
ropey = "2.0.0-beta.1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
smol = "2.0"
tracing = "0.1"
walkdir = "2.5.0"
rand = "0.10.1"
thiserror = "2.0.18"
docx-rs = "0.4.20"
printpdf = { version = "0.7.0", default-features = false }
fastembed = { version = "5.13.3", default-features = false, features = ["hf-hub-native-tls", "ort-load-dynamic"] }
urlencoding = "2.1.3"
base64 = "0.22"
pdf-extract = "0.7"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ring = "0.17"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
